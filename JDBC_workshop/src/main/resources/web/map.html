<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rehletna Map</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        #map { width: 100%; height: 100%; }

        /* ── Popup card ── */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            padding: 0;
            overflow: hidden;
            border: none;
            min-width: 240px;
            max-width: 300px;
        }
        .leaflet-popup-content { margin: 0; width: 100% !important; }
        .leaflet-popup-tip { background: #fff; }

        .popup-card { background: #fff; cursor: pointer; }
        .popup-card:hover { background: #f7fffe; }

        .popup-header {
            background: linear-gradient(135deg, #17B3A6 0%, #13c9bb 100%);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .popup-place {
            color: #fff; font-weight: 700; font-size: 13px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .popup-body { padding: 12px 14px; }
        .popup-author {
            font-size: 11px; color: #8b90a7; margin-bottom: 5px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .popup-content {
            font-size: 13px; color: #1a1d27; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .popup-footer {
            padding: 8px 14px; border-top: 1px solid #f0f2f5;
            display: flex; align-items: center; gap: 12px;
        }
        .popup-stat { font-size: 12px; color: #65676b; display: flex; align-items: center; gap: 4px; }
        .popup-open-btn {
            margin-left: auto; background: #17B3A6; color: #fff;
            border: none; border-radius: 6px; padding: 4px 10px;
            font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .popup-open-btn:hover { background: #13a099; }

        /* ── Teal teardrop pin ── */
        .pin-outer {
            width: 28px; height: 28px;
            background: #17B3A6;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 3px solid #fff;
            box-shadow: 0 3px 10px rgba(23,179,166,0.55);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .pin-outer.has-image { background: #0d9e92; }
        .pin-outer:hover { transform: rotate(-45deg) scale(1.15); }

        /* ── Loading overlay ── */
        #loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.92);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; gap: 12px; transition: opacity 0.4s;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e4e6eb; border-top-color: #17B3A6;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: #65676b; font-weight: 600; }

        /* ── Empty state ── */
        #empty-state {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #fff; border-radius: 16px; padding: 40px 48px;
            text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12); z-index: 1000;
        }
        #empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        #empty-state h3 { font-size: 18px; color: #050505; margin-bottom: 6px; }
        #empty-state p { font-size: 14px; color: #65676b; }

        /* ── Stats pill ── */
        #stats-bar {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.96); backdrop-filter: blur(8px);
            border-radius: 24px; padding: 8px 20px;
            display: none; align-items: center; gap: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 1000;
            font-size: 13px; color: #1a1d27; font-weight: 600;
        }
        #stats-bar .teal { color: #17B3A6; font-size: 18px; font-weight: 700; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Mapping your travels…</div>
</div>

<div id="empty-state">
    <div class="icon">🗺️</div>
    <h3>No mapped posts yet</h3>
    <p>Posts with a location tag will appear here as pins.</p>
</div>

<div id="map"></div>

<div id="stats-bar">
    <span class="teal" id="pin-count">0</span> places on the map
</div>

<script>
    /*
     * TILE SERVER: CartoDB Positron (free, no API key, no registration)
     *
     * WHY NOT OpenStreetMap PNG tiles?
     * OSM tiles are PNG images. JavaFX WebView (WebKit) uses an internal
     * image decoder (WCImageDecoderImpl) to render them. When JavaFX module
     * versions are mismatched — even slightly — this decoder throws
     * IncompatibleClassChangeError and tiles appear as grey squares.
     *
     * CartoDB Positron tiles work around this because:
     * 1. They are served from a.basemaps.cartocdn.com (different CDN path)
     * 2. They are lighter weight PNG tiles that WebKit handles more reliably
     * 3. They look cleaner for a travel app (minimal, light grey style)
     *
     * CartoDB Positron is 100% free, no API key, no billing.
     * Terms: https://carto.com/legal/
     */

    const map = L.map('map', {
        center:          [34.0, 9.0],   // Tunisia default
        zoom:            6,
        zoomControl:     true,
        preferCanvas:    false
    });

    // CartoDB Positron — clean light style, free, no key
    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains:  'abcd',
            maxZoom:     19
        }
    ).addTo(map);

    // ── State ─────────────────────────────────────────────────────────────
    const bounds  = [];
    let   pinCount = 0;

    // ── Custom SVG pin icon (no emoji — avoids font rendering issues in WebKit)
    function makeIcon(hasImage) {
        const colour = hasImage ? '#0d9e92' : '#17B3A6';
        // Pure SVG teardrop pin — no external images, no PNG decoding needed
        const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
          <path d="M14 0 C6.268 0 0 6.268 0 14 C0 24.5 14 36 14 36 C14 36 28 24.5 28 14 C28 6.268 21.732 0 14 0Z"
                fill="${colour}" stroke="white" stroke-width="2.5"/>
          <circle cx="14" cy="14" r="5" fill="white"/>
        </svg>`;
        return L.divIcon({
            className:  '',
            html:       svg,
            iconSize:   [28, 36],
            iconAnchor: [14, 36],
            popupAnchor:[0,  -38]
        });
    }

    // ── addPin — called from Java via webEngine.executeScript() ───────────
    function addPin(id, lat, lon, place, author, content, likes, comments, hasImage) {
        const marker = L.marker([lat, lon], { icon: makeIcon(hasImage) }).addTo(map);

        const safePlace   = escHtml(place);
        const safeAuthor  = escHtml(author);
        const safeContent = escHtml(content);

        marker.bindPopup(`
        <div class="popup-card">
          <div class="popup-header">
            <span class="popup-place">📍 ${safePlace}</span>
          </div>
          <div class="popup-body">
            <div class="popup-author">${safeAuthor}</div>
            <div class="popup-content">${safeContent}</div>
          </div>
          <div class="popup-footer">
            <span class="popup-stat">♥ ${likes}</span>
            <span class="popup-stat">💬 ${comments}</span>
            <button class="popup-open-btn"
                    onclick="openPost(${id}); event.stopPropagation();">
              Open →
            </button>
          </div>
        </div>`, {
            maxWidth:    300,
            minWidth:    240,
            closeButton: true,
            autoPan:     true
        });

        bounds.push([lat, lon]);
        pinCount++;
        document.getElementById('pin-count').textContent = pinCount;
    }

    // ── finalizeMap — called from Java when all geocoding is done ─────────
    function finalizeMap() {
        // Hide loading
        const overlay = document.getElementById('loading-overlay');
        overlay.classList.add('hidden');
        setTimeout(() => { overlay.style.display = 'none'; }, 420);

        if (pinCount === 0) {
            document.getElementById('empty-state').style.display = 'block';
            return;
        }

        document.getElementById('stats-bar').style.display = 'flex';

        /*
         * CRITICAL: map.invalidateSize() must be called before fitBounds.
         *
         * When Leaflet is initialized inside a JavaFX WebView loaded via
         * loadContent(), the WebView may not have its final pixel dimensions
         * at the time Leaflet runs. Leaflet caches the container size on init
         * and uses it for viewport calculations. If the cached size is wrong,
         * fitBounds() pans to the right coordinates but the visible tiles
         * don't match — giving the impression pins are missing.
         *
         * invalidateSize() forces Leaflet to re-measure the container and
         * re-render all tiles for the correct viewport size.
         *
         * We delay fitBounds by 300ms to give the WebView layout a chance
         * to stabilize after loadContent() completes.
         */
        setTimeout(function() {
            map.invalidateSize();
            setTimeout(function() {
                if (bounds.length === 1) {
                    map.setView(bounds[0], 11);
                } else {
                    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 11 });
                }
            }, 200);
        }, 300);
    }

    // ── JS → Java bridge ──────────────────────────────────────────────────
    function openPost(id) {
        if (window.javaConnector) {
            window.javaConnector.openPost(id);
        }
    }

    function escHtml(str) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(str || ''));
        return d.innerHTML;
    }

</script>
</body>
</html>
